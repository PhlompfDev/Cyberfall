[workspace]
exclude = ["crates/cyberfall-plugin"]
resolver = "2"
members = ["crates/pilot-core", "crates/pilot-tuning", "crates/world-parry", "crates/gym", "crates/replay", "crates/cyberfall-bridge"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
parry3d = "0.17"
bevy = "0.16"

# The gym is unplayable without optimised dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
